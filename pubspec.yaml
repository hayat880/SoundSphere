name: soundsphere
description: "SoundSphere: music, focus and balance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  provider: ^6.1.5+1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  crypto: ^3.0.7
  flutter_local_notifications: 22.3.1
  audio_service: ^0.18.19
  permission_handler: ^13.0.2
  google_sign_in: ^7.2.0
  audio_metadata_reader: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/ambient/